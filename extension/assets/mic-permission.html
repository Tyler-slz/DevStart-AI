<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevStart AI — Microphone</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0b0e;
      --surface: #11141a;
      --line: rgba(255, 255, 255, 0.1);
      --text: #e9ebef;
      --muted: #a0a4ad;
      --dim: #858a94;
      --pink: #ff4d7d;
      --purple: #a855f7;
      --blue: #4f7cff;
      --cyan: #38cfff;
      --green: #2dd4a7;
      --yellow: #ffcc57;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: conic-gradient(from 210deg, var(--pink), var(--purple), var(--blue), var(--cyan), var(--green), var(--yellow), var(--pink));
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) { background: #fff; }
    button:disabled { opacity: 0.55; cursor: default; }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--dim);
      font-size: 12.5px;
    }

    .status.is-ok { color: var(--green); }
    .status.is-fail { color: var(--pink); }

    .privacy {
      margin: 18px 0 0;
      color: var(--dim);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">DevStart AI</span>
    </div>

    <h1>Allow microphone</h1>
    <p>Voice input lets you ask about the repository without typing. Audio is sent to your browser's speech recognition service, not stored by DevStart AI.</p>

    <button id="allowBtn" type="button">Allow microphone</button>
    <p class="status" id="status" role="status"></p>
    <p class="privacy">You can revoke this at any time in the browser's site settings. This tab closes itself once access is granted.</p>
  </main>

  <script src="mic-permission.js"></script>
</body>
</html>
